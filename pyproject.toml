[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shikumi"
version = "0.2.3"
description = "Interpret Python runtime objects as structured semantic views."
keywords = [
  "semantic-modeling",
  "declarative",
  "runtime-introspection",
  "structured-data",
  "llm",
]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "minoru_jp" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/minoru-jp/shikumi"
Repository = "https://github.com/minoru-jp/shikumi"
Documentation = "https://github.com/minoru-jp/shikumi/tree/main/docs"
Issues = "https://github.com/minoru-jp/shikumi/issues"

[project.scripts]
shikumi = "shikumi.cli:main"

[dependency-groups]
docs = ["shikumi-devdoc>=0.3.2"]
test = [
  { include-group = "docs" },
  "shikumi-devdoc[test]",
]
quality = [
  "basedpyright==1.40.1",
  "ruff==0.16.10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", ".", "examples"]

[tool.hatch.build.targets.wheel]
packages = ["src/shikumi"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "shikumi/_docs/README.md"
"CHANGELOG.md" = "shikumi/_docs/CHANGELOG.md"
"STATUS.md" = "shikumi/_docs/STATUS.md"
"docs" = "shikumi/_docs"
"examples" = "shikumi/_examples"

[tool.hatch.build.targets.sdist]
# An sdist is the complete release source. Hatchling includes the project by
# default (while respecting VCS ignore rules); exclude only repository-operation
# files that are not part of the release itself. Hatchling always keeps the
# root .gitignore in an sdist, while the paths ignored by it remain omitted.
exclude = [
  "/.github",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
# Generated and translated Markdown is governed by the canonical-source workflow,
# not by direct formatter edits. Ruff still formats the Python source that
# produces these artifacts.
exclude = [
  "README.md",
  "CHANGELOG.md",
  "STATUS.md",
  "docs/**",
  "devdocs/README.md",
  "devdocs/canonical_documents/**",
  "examples/**/README.md",
]

[tool.basedpyright]
include = ["src/shikumi"]
pythonVersion = "3.11"
reportUnnecessaryIsInstance = false
reportImplicitStringConcatenation = false
reportExplicitAny = false
reportPrivateUsage = false
reportImplicitOverride = false
