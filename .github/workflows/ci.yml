name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -U pip pytest shikumi-devdoc==0.1.0
      - name: Run tests
        run: python -m pytest

  docs:
    name: Documentation drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install documentation tool
        run: python -m pip install -U pip shikumi-devdoc==0.1.0
      - name: Check generated documentation
        run: python scripts/render_canonical_docs.py --check

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install type checker
        run: python -m pip install -U pip mypy
      - name: Run mypy
        env:
          MYPYPATH: src
        run: python -m mypy --strict src/shikumi tests/typing

  package:
    name: Build distribution
    needs: [test, typecheck]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install -U pip build twine
      - name: Build wheel and sdist
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Check archive contents
        run: python scripts/check_dist.py dist
      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke test installed package
        run: |
          python -c "import shikumi; from importlib.resources import files; assert files('shikumi').joinpath('_docs', 'api-reference.md').is_file()"
          python -c "from importlib.resources import files; root = files('shikumi').joinpath('_examples'); assert root.joinpath('architecture', 'README.md').is_file(); assert root.joinpath('web_api', 'shikumi_lib', 'norms', '__init__.py').is_file()"
          shikumi --help
