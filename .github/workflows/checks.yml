name: Reusable checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff and basedpyright
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group quality

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run Ruff lint
        run: ruff check .

      - name: Run basedpyright
        run: basedpyright

      - name: Check consumer typing contract
        run: basedpyright -p tests/typing

  canonical-docs:
    name: Check canonical documents
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group docs

      - name: Check canonical documents
        run: python scripts/render_canonical_docs.py --check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group test

      - name: Run tests
        run: python -m pytest
